<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Telas · Ponderada S3</title>
<link rel="stylesheet" href="../DS_govbr_completo/fontawesome-free-6/css/all.min.css">
<link rel="stylesheet" href="../DS_govbr_completo/govbr-ds-core-3.7.0/dist/core.min.css">
<style>
@font-face{font-family:Rawline;font-weight:400;font-style:normal;src:url(../DS_govbr_completo/rawline-webfont/files/rawline-latin-400-normal.woff2) format("woff2")}
@font-face{font-family:Rawline;font-weight:400;font-style:italic;src:url(../DS_govbr_completo/rawline-webfont/files/rawline-latin-400-italic.woff2) format("woff2")}
@font-face{font-family:Rawline;font-weight:500;font-style:normal;src:url(../DS_govbr_completo/rawline-webfont/files/rawline-latin-500-normal.woff2) format("woff2")}
@font-face{font-family:Rawline;font-weight:500;font-style:italic;src:url(../DS_govbr_completo/rawline-webfont/files/rawline-latin-500-italic.woff2) format("woff2")}
@font-face{font-family:Rawline;font-weight:600;font-style:normal;src:url(../DS_govbr_completo/rawline-webfont/files/rawline-latin-600-normal.woff2) format("woff2")}
@font-face{font-family:Rawline;font-weight:700;font-style:normal;src:url(../DS_govbr_completo/rawline-webfont/files/rawline-latin-700-normal.woff2) format("woff2")}
@font-face{font-family:"Font Awesome 5 Free";font-weight:900;src:url(../DS_govbr_completo/fontawesome-free-6/webfonts/fa-solid-900.woff2) format("woff2")}

/* ---------- Apresentação (fora do produto) ---------- */
body{background:#eef0f2;margin:0}
.wrap{max-width:1480px;margin:0 auto;padding:24px 16px 48px}
.pick{display:flex;flex-wrap:wrap;gap:8px;align-items:center;margin-bottom:12px}
.pick .lbl{font-size:12px;font-weight:600;color:#636363;width:56px}
.stage{margin-top:20px}
.viewport{width:100%;overflow:hidden}
.why{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:0 24px;background:#fff;border-left:4px solid #e8613c;padding:16px 16px 4px;font-size:14px;margin:16px 0 0}
@media (max-width:900px){.why{grid-template-columns:1fr 1fr}}
.why div{min-width:0}
/* modo print: só a tela, em 1440 x 900 */
body.print{background:#fff}
body.print .wrap{max-width:none;padding:0}
body.print .pick,body.print .why{display:none}
body.print .stage{margin:0}
.why dt{font-size:12px;font-weight:600;color:#636363;margin:0}
.why dd{margin:2px 0 14px}

/* ---------- O produto ---------- */
/* Tela de computador: 1440 x 900, com a moldura do e-Cidade (barra do usuário, janela, rodapé e menu) */
.frame{width:1440px;height:900px;background:#fff;border:1px solid #ccc;overflow:hidden;display:flex;flex-direction:column;transform-origin:0 0}
body.print .frame{border:0}
.topbar{height:40px;flex:none;display:flex;align-items:center;justify-content:flex-end;gap:16px;padding:0 20px;background:#fff;border-bottom:1px solid #e6e6e6;font:13px Arial,sans-serif;color:#1351b4}
.legacy-bar{flex:none;background:#3d6b98;color:#fff;font:600 13px/1 Arial,sans-serif;padding:10px 16px}
.screen{flex:1;overflow:auto;padding:24px 56px}
.screen-in{max-width:960px;margin:0 auto}
.status{flex:none;display:flex;justify-content:space-between;padding:6px 16px;background:#f3f3f3;border-top:1px solid #e0e0e0;font:12px Arial,sans-serif;color:#555}
.taskbar{flex:none;height:32px;background:#3d6b98;color:#fff;font:600 13px/32px Arial,sans-serif;padding:0 20px}
.br-tag i{margin-right:6px}
.br-tag.bg-warning,.br-tag.bg-gray-20{color:#1b1b1b}
.line{display:flex;align-items:center;justify-content:space-between;gap:16px;padding:12px 0}
.line + .line{border-top:1px solid var(--gray-10)}
.slot{margin-bottom:24px}
.slot .br-message{margin:0}
.slot .br-message + .br-message{margin-top:8px}
.sec{font-size:var(--font-size-scale-up-01);font-weight:600;margin:32px 0 8px}
.foot{display:flex;justify-content:flex-end;align-items:center;gap:8px;margin-top:32px}
.foot .note{margin-right:auto;color:var(--gray-60)}
</style>
</head>
<body>
<div class="wrap">
  <div class="pick" id="pickTela"><span class="lbl">Tela</span></div>
  <div class="pick" id="pickEstado"><span class="lbl">Estado</span></div>
  <div class="stage">
    <div class="viewport"><div id="tela"></div></div>
    <dl class="why" id="why"></dl>
  </div>
</div>

<script>
/* ---------- Peças do DS (marcação dos exemplos oficiais) ---------- */
const ICON = {success:'fa-check-circle', warning:'fa-exclamation-triangle', danger:'fa-times-circle', info:'fa-info-circle'};
const msg = (type, title, body = '', action = '') => `
  <div class="br-message ${type}">
    <div class="icon"><i class="fas ${ICON[type]} fa-lg" aria-hidden="true"></i></div>
    <div class="content" role="${type === 'danger' || type === 'warning' ? 'alert' : 'status'}"><div>
      <span class="message-title">${title}</span>${body ? `<span class="message-body"> ${body}</span>` : ''}
      ${action ? `<div class="mt-2">${action}</div>` : ''}
    </div></div>
  </div>`;
const tag = (bg, icon, text) => `<span class="br-tag ${bg} small"><i class="fas ${icon}" aria-hidden="true"></i><span>${text}</span></span>`;
const btn = (kind, text, icon = '', dis = false) => `<button class="br-button ${kind} small" type="button" ${dis ? 'disabled' : ''}>${icon ? `<i class="fas ${icon}" aria-hidden="true"></i>` : ''}${text}</button>`;

const PRONTO = tag('bg-success', 'fa-check', 'Pronto');
const PEND = tag('bg-danger', 'fa-ban', 'Pendente');
const CONF = tag('bg-warning', 'fa-question-circle', 'A confirmar');
const SALVO = tag('bg-success', 'fa-check', 'Salvo');
const NSALVO = tag('bg-gray-20', 'fa-redo', 'Não salvo');

const line = (name, meta, right) => `<div class="line"><div><div class="text-weight-semi-bold">${name}</div>${meta ? `<div class="text-down-01 text-gray-60">${meta}</div>` : ''}</div><div class="d-flex align-items-center" style="gap:8px">${right}</div></div>`;

const TOP = `<div class="topbar"><i class="fas fa-comment-alt" aria-hidden="true"></i><span>user_demo</span><i class="fas fa-user" aria-hidden="true"></i></div>`;
const STATUS_ = dep => `<div class="status"><span>Instituição: 1 - PREFEITURA DBSELLER · Departamento: ${dep}</span><span>Data: 30/10/2026 · Exercício: 2026</span></div><div class="taskbar">MENU</div>`;
/* ---------- Regra única: todo alerta aparece no mesmo lugar ----------
   Logo abaixo do título da tela, antes de qualquer campo. Se houver mais de um,
   o resultado da ação vem primeiro e o aviso permanente depois. */
const slot = (...m) => m.length ? `<div class="slot">${m.join('')}</div>` : '';

/* ---------- Tela 1: Requisição de Exames (recepção) ---------- */
function requisicao({alertas = [], busca = '', resultados = '', lista = '', salvar = 'primary'}) {
  return `<div class="frame">${TOP}<div class="legacy-bar">Requisição de Exames &gt; Lançar</div><div class="screen"><div class="screen-in">
    <h1 class="text-up-03 text-weight-semi-bold m-0">Requisição de exames</h1>
    <p class="text-gray-60 mt-1 mb-4">Daiane Souza · solicitado por Dra. Marina Lopes</p>
    ${slot(...alertas)}
    <div class="br-input">
      <label for="b">Exame</label>
      <div class="input-group"><div class="input-icon"><i class="fas fa-search" aria-hidden="true"></i></div>
        <input id="b" type="text" value="${busca}" placeholder="Nome, sigla ou código"></div>
    </div>
    ${resultados ? `<div class="mt-2">${resultados}</div>` : ''}
    <p class="sec">Exames nesta requisição</p>
    ${lista || '<p class="text-gray-60">Nenhum exame adicionado.</p>'}
    <div class="foot">${btn('', 'Cancelar')}${btn(salvar, 'Salvar requisição')}</div>
  </div></div>${STATUS_('Recepção · UBS Centro')}</div>`;
}
const HMG = line('Hemograma completo', 'Laboratório Central', SALVO);

/* ---------- Tela 2: Cadastro de Exame (laboratório) ---------- */
function cadastro({alertas = [], campo1, campo2, vinculado = '', nota}) {
  return `<div class="frame">${TOP}<div class="legacy-bar">Exame &gt; Alteração</div><div class="screen"><div class="screen-in">
    <h1 class="text-up-03 text-weight-semi-bold m-0">Glicose jejum</h1>
    <p class="text-gray-60 mt-1 mb-4">Exame · Laboratório Central</p>
    ${slot(...alertas)}
    <div class="br-tab mb-4"><nav class="tab-nav"><ul>${['Exame', 'Material', 'Procedimento', 'Setor'].map(n =>
      `<li class="tab-item ${n === 'Procedimento' ? 'is-active' : ''}"><button type="button"><span class="name">${n}</span></button></li>`).join('')}</ul></nav></div>
    <div class="row"><div class="col-sm-8 mb-3">${campo1}</div><div class="col-sm-4 mb-3">${campo2}</div></div>
    ${vinculado}
    <div class="foot"><span class="note text-down-01">${nota}</span>${btn('', 'Cancelar')}${btn('primary', 'Incluir procedimento')}</div>
  </div></div>${STATUS_('Laboratório Central')}</div>`;
}
/* Campo com erro: só a borda vermelha; o texto do erro fica no alerta do topo */
const field = (id, label, value, state = '', icon = '') => `
  <div class="br-input ${state}"><label for="${id}">${label}${state === 'danger' ? ' <span class="text-danger text-down-01">(corrigir)</span>' : ''}</label>
    ${icon ? `<div class="input-group"><div class="input-icon"><i class="fas ${icon}" aria-hidden="true"></i></div>` : ''}
    <input id="${id}" type="text" value="${value}" placeholder="" ${state === 'danger' ? 'aria-invalid="true"' : ''}>${icon ? '</div>' : ''}
  </div>`;
const FALTA = msg('warning', 'Ainda não aparece para a recepção.', 'Falta vincular o procedimento SIGTAP.');

/* ---------- Os estados ---------- */
const TELAS = {
 requisicao: { nome: 'Requisição (recepção)', estados: [
  { id:'sucesso', nome:'Sucesso', ds:'Mensagem de sucesso', tipo:'—',
    origem:'Fluxo normal da etapa 5 do to-be.',
    faz:'Confirma o que entrou na requisição e libera a busca para o próximo exame.',
    html: requisicao({ alertas: [msg('success', 'Hemograma completo adicionado.', 'Coleta em 31/10.')], lista: HMG }) },
  { id:'atencao', nome:'Atenção', ds:'Mensagem de atenção', tipo:'Contexto: o dado pode estar desatualizado',
    origem:'Risco "janela de atraso" do to-be (etapa 6): o Serviço de Prontidão reavalia de tempos em tempos.',
    faz:'Diz por que não tem certeza e o que fazer. Recomenda verificar de novo; adicionar mesmo assim fica como opção secundária.',
    html: requisicao({ busca:'TSH',
      alertas: [msg('warning', 'A disponibilidade do TSH pode ter mudado.', 'O cadastro foi alterado depois da última verificação (14h05).', btn('secondary', 'Verificar agora', 'fa-sync-alt'))],
      resultados: line('TSH', 'Laboratório Central', CONF + btn('', 'Adicionar mesmo assim')),
      lista: HMG }) },
  { id:'erro', nome:'Erro', ds:'Mensagem de erro', tipo:'Contexto: o sistema esconde o exame sem avisar',
    origem:'P1 da S2 (H9 e H1, severidade 4), cruzamento X3. Hoje a tela responde "Nenhum Registro Retornado".',
    faz:'Mostra o exame bloqueado, o motivo e quem resolve. Não perde o que já foi adicionado e deixa seguir com os outros exames.',
    html: requisicao({ busca:'Glicose',
      alertas: [msg('danger', 'Glicose jejum não pode ser requisitado agora.', 'Falta o procedimento SIGTAP no cadastro. O Laboratório Central já foi avisado.')],
      resultados: line('Glicose jejum', 'Laboratório Central', PEND + btn('secondary', 'Adicionar', '', true)) +
                  line('Glicose pós-prandial', 'Laboratório Central', PRONTO + btn('secondary', 'Adicionar')),
      lista: HMG }) },
  { id:'informacao', nome:'Informação', ds:'Mensagem de informação', tipo:'Sistema: uma parte funcionou, outra não',
    origem:'Convivência legado + serviço (to-be, etapa 5) e PS6 do ATAM: cada gravação é separada.',
    faz:'Diz quantos foram salvos e quais faltam. O botão principal tenta só os que faltaram, sem recomeçar.',
    html: requisicao({ salvar:'secondary',
      alertas: [msg('info', '3 de 5 exames salvos.', 'TSH e Creatinina não foram salvos porque o Laboratório não respondeu.', btn('primary', 'Tentar os 2 de novo', 'fa-redo'))],
      lista: HMG + line('Glicose pós-prandial', 'Laboratório Central', SALVO) + line('Colesterol HDL', 'Laboratório Central', SALVO) +
             line('TSH', 'Laboratório Central', NSALVO) + line('Creatinina', 'Laboratório Central', NSALVO) }) },
  { id:'indisponivel', nome:'Indisponível', ds:'Mensagem de erro', tipo:'Sistema: o serviço caiu',
    origem:'Risco do to-be (etapa 5): "se o serviço cair, a requisição precisa de um modo degradado".',
    faz:'Avisa o que não funciona agora e que nada foi perdido. A busca continua no modo antigo, mas nenhum exame é marcado "Pronto" sem verificação.',
    html: requisicao({ busca:'Hemograma',
      alertas: [msg('danger', 'Não conseguimos verificar os exames agora.', 'A busca está no modo antigo e não mostra pendências. Sua requisição continua salva aqui.', btn('secondary', 'Tentar de novo', 'fa-sync-alt'))],
      resultados: line('Hemograma completo', 'Laboratório Central', btn('secondary', 'Adicionar')) }) },
 ]},
 cadastro: { nome: 'Cadastro (laboratório) · ir além', estados: [
  { id:'validar', nome:'Erro no campo', ds:'Mensagem de erro', tipo:'Entrada: o código digitado não existe',
    origem:'P2 da S2 (H5, severidade 3): o exame fica ativo antes de estar completo. ATAM §5.2.3: falta validar ao ativar.',
    faz:'Avisa enquanto a pessoa digita, no mesmo lugar de todos os alertas, e marca o campo em vermelho. Nada é apagado.',
    html: cadastro({ alertas: [msg('danger', 'Código SIGTAP não encontrado.', 'O código 0202010470 não existe na competência 10/2026. Confira os dígitos.'), FALTA],
      campo1: field('p', 'Procedimento SIGTAP', '0202010470', 'danger', 'fa-search'),
      campo2: field('d', 'Início', '01/11/2026'), nota: 'Rascunho salvo às 14h31' }) },
  { id:'incluir', nome:'Erro ao incluir', ds:'Mensagem de erro', tipo:'Entrada: campos inválidos',
    origem:'Mesmo P2: hoje o legado aceita o exame incompleto sem aviso.',
    faz:'Diz que o procedimento não foi incluído e o que corrigir em cada campo. Os campos ficam marcados e o que foi digitado continua lá.',
    html: cadastro({ alertas: [msg('danger', 'Procedimento não incluído.', 'Procedimento SIGTAP: mais de um encontrado, escolha um da lista. Início: data inválida.'), FALTA],
      campo1: field('p', 'Procedimento SIGTAP', 'dosagem glicose', 'danger', 'fa-search'),
      campo2: field('d', 'Início', '31/02/2026', 'danger'), nota: 'Rascunho salvo às 14h33' }) },
  { id:'pronto', nome:'Sucesso', ds:'Mensagem de sucesso', tipo:'—',
    origem:'Fecha o ciclo com a tela 1: a recepção passa a encontrar o exame.',
    faz:'Confirma que o exame está pronto e diz o efeito para quem depende dele (a recepção).',
    html: cadastro({ alertas: [msg('success', 'Pronto para requisitar.', 'A recepção já encontra este exame.')],
      campo1: field('p', 'Procedimento SIGTAP', '', '', 'fa-search'), campo2: field('d', 'Início', ''),
      vinculado: `<p class="sec">Procedimento vinculado</p>` + line('0202010473 · Dosagem de glicose', 'Desde 01/11/2026', tag('bg-success', 'fa-check', 'Ativo')),
      nota: 'Salvo às 14h36' }) },
 ]},
};

/* ---------- Navegação ---------- */
let atual = {tela: 'requisicao', estado: 0};
function draw() {
  const t = TELAS[atual.tela], e = t.estados[atual.estado];
  document.getElementById('pickTela').innerHTML = '<span class="lbl">Tela</span>' + Object.entries(TELAS).map(([k, v]) =>
    `<button class="br-button small ${k === atual.tela ? 'primary' : 'secondary'}" onclick="atual={tela:'${k}',estado:0};draw()">${v.nome}</button>`).join('');
  document.getElementById('pickEstado').innerHTML = '<span class="lbl">Estado</span>' + t.estados.map((s, i) =>
    `<button class="br-button small ${i === atual.estado ? 'primary' : 'secondary'}" onclick="atual.estado=${i};draw()">${s.nome}</button>`).join('');
  document.getElementById('tela').innerHTML = e.html;
  document.getElementById('why').innerHTML = `
    <div><dt>Componente do DS</dt><dd>${e.ds}</dd></div>
    <div><dt>Tipo de erro</dt><dd>${e.tipo}</dd></div>
    <div><dt>De onde vem</dt><dd>${e.origem}</dd></div>
    <div><dt>O que a tela faz</dt><dd>${e.faz}</dd></div>`;
  fit();
}
/* A tela tem 1440 x 900; na página ela é reduzida para caber na largura disponível */
function fit() {
  const f = document.querySelector('#tela .frame'); if (!f) return;
  if (document.body.classList.contains('print')) { f.style.zoom = 1; return; }
  f.style.zoom = Math.min(1, document.querySelector('.viewport').clientWidth / 1440);
}
window.addEventListener('resize', fit);
if (new URLSearchParams(location.search).has('print')) document.body.classList.add('print');
const h = location.hash.slice(1).split('/');
if (TELAS[h[0]]) atual = {tela: h[0], estado: Math.max(0, TELAS[h[0]].estados.findIndex(s => s.id === h[1]))};
draw();
</script>
</body>
</html>
